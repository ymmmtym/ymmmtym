name: CI
on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_SNAKE_OUTPUT_DIR: "dist"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-snake:
    name: GitHub Snake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ env.GITHUB_SNAKE_OUTPUT_DIR }}/github-snake.svg
            ${{ env.GITHUB_SNAKE_OUTPUT_DIR }}/github-snake-dark.svg?palette=github-dark
      - name: Open pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/github-snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "${GITHUB_SNAKE_OUTPUT_DIR}"; then
            git checkout -b "${BRANCH}"
            git add "${GITHUB_SNAKE_OUTPUT_DIR}"
            git commit -m "📊 Update github-snake"
            git push --force origin "${BRANCH}"
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${BRANCH}" \
              --title "📊 Update github-snake" \
              --body "Automated refresh of the contribution snake generated by the CI workflow. This pull request was created by an AI agent (OpenHands) on behalf of the repository owner." \
              || echo "Pull request already exists; reusing it."
            gh pr merge "${BRANCH}" --squash --auto --delete-branch \
              || gh pr merge "${BRANCH}" --squash --delete-branch
          else
            echo "No snake changes; nothing to do."
          fi
